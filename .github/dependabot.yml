# 依存の更新 PR（docs/17 B10）。pip は月曜の朝にまとめて、Actions も週 1。
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # 10/26: 依存ごとの PR をやめて週 1 本にまとめる（10 月は依存ごとの PR と更新の確認で約 140 分＋各 PR のテスト。pydantic と pydantic-core のように
    # 組でないと入らない更新が別々の PR になり、どちらも落ちていた）。セキュリティの更新も同じ 1 本にまとめる
    groups:
      python:
        applies-to: version-updates
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    # 11/9: pytest 9.2 の monkeypatch は元の値を対象の __dict__ から取る。app.py の _AppModule（appmod.X を部品へ渡す互換）では
    # 元の値が「無い」になり、undo が delattr で落ちて差し替えが次の試験へ漏れる（手元で 54 failed・68 errors）。互換を外すまで 9.1 に留める
    ignore:
      - dependency-name: "pytest"
        versions: [">=9.2"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
  # 11/3 リファクタリング要件 Phase 3 SEC-OPS-02: Dockerfile の基の像（digest で固定）を週 1 で上げる。ワーカーと受付で 1 本ずつ
  - package-ecosystem: "docker"
    directory: "/deploy/gpu004"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    labels: ["dependencies"]
  - package-ecosystem: "docker"
    directory: "/deploy/gpu004/user-mode"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    labels: ["dependencies"]
