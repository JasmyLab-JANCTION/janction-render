name: Bug report
description: Something did not work (a tool call, the CLI, the add-on, a render)
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show janction-render`, or the `v0.x.y` in the footer of render.janction.jp
      placeholder: 0.4.17
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Where did you call it from?
      options: [Claude.ai, Claude Code, ChatGPT, Codex, Cursor, VS Code, Windsurf, Gemini CLI / Antigravity, Grok, Perplexity, Le Chat, Notion, Cline, Goose, CLI, HTTP API, Blender add-on, Maya / Houdini / Cinema 4D, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The tool or command, the error code and `detail` from the response (please remove API keys), and what you expected
    validations:
      required: true
  - type: input
    id: job
    attributes:
      label: Job id (if any)
      placeholder: j_0123456789abcdef
  - type: textarea
    id: scene
    attributes:
      label: Scene (optional)
      description: The bpy script or a description of the .blend / 3D file. Do not paste private assets.
