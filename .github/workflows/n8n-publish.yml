# n8n のコミュニティノード（integrations/n8n、npm の n8n-nodes-janction-render）を公開する。タグ n8n-v<版> を push すると
# npmjs.com に --provenance つきで公開する（n8n の検証済みノードの審査は provenance を求める）。認証は npm-publish.yml と同じ
# NPM_TOKEN（新しいパッケージを作れる権限が要る）。版は integrations/n8n/package.json の version と一致していること。
name: n8n-publish

on:
  push:
    tags:
      - "n8n-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/n8n
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/n8n-v')
        run: |
          V=$(node -p "require('./package.json').version")
          test "n8n-v$V" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package.json $V" >&2; exit 1; }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
