# npm の公開（npm/ のランチャー janction-render）。タグ npm-v<版> を push すると npmjs.com に公開する。
# 認証は npm の granular access token（公開リポの secret NPM_TOKEN）。npm 側で Trusted Publishing（OIDC）を設定した後は
# NPM_TOKEN を消しても id-token で通る（--provenance が出所を付ける）。版は npm/package.json の version と一致していること。
name: npm-publish

on:
  push:
    tags:
      - "npm-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/npm-v')
        run: |
          tag="${GITHUB_REF_NAME#npm-v}"
          ver="$(node -p "require('./package.json').version")"
          [ "$tag" = "$ver" ] || { echo "tag $tag != package.json $ver"; exit 1; }
      - run: npm ci --omit=dev
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
