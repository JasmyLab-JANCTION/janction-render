[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "janction-render"
version = "0.3.3"
description = "Cloud GPU render farm for Blender, for AI agents: MCP server (remote + stdio) and CLI. Render Blender without a GPU from Claude, ChatGPT, Claude Code, Codex, Cursor."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "mcp>=1.10"]

[project.optional-dependencies]
mcp = ["mcp>=1.10"]
blend = ["blender-asset-tracer>=1.20"]
dev = ["pytest>=8"]

[project.scripts]
janction-render = "janction_render.cli:main"
janction-render-mcp = "janction_render.mcp_server:main"

[tool.setuptools.packages.find]
include = ["janction_render*"]
