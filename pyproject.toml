[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "janction-render"
version = "0.4.17"
description = "Cloud GPU render farm for Blender, built for AI agents: MCP server (remote + stdio), HTTP API and CLI. Send a .blend, a bpy script or a 3D file (glTF/FBX/USD) and get frames or an MP4 back; no local Blender or GPU. Free beta."
readme = "README.md"
keywords = ["blender", "rendering", "render-farm", "cloud-rendering", "gpu", "mcp", "mcp-server", "model-context-protocol", "ai-agent", "claude", "codex", "cursor", "gltf", "bpy"]
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "mcp>=1.10"]
authors = [{ name = "JasmyLab Inc.", email = "contact@jasmylab.com" }]

[project.urls]
Homepage = "https://render.janction.jp"
Documentation = "https://render.janction.jp/blender-render-api"
Repository = "https://github.com/JasmyLab-JANCTION/janction-render"
Issues = "https://github.com/JasmyLab-JANCTION/janction-render/issues"
Status = "https://render.janction.jp/status"

[project.optional-dependencies]
mcp = ["mcp>=1.10"]
blend = ["blender-asset-tracer>=1.20"]
dev = ["pytest>=8"]

[project.scripts]
janction-render = "janction_render.cli:main"
janction-render-mcp = "janction_render.mcp_server:main"

[tool.setuptools.packages.find]
include = ["janction_render*"]

[tool.setuptools.package-data]
janction_render = ["mcp_app.html"]
