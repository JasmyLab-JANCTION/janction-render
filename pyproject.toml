[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "janction-render"
version = "0.4.31"
description = "Cloud GPU render farm for Blender, built for AI agents: MCP server (remote + stdio), HTTP API and CLI. Send a .blend, a bpy script or a 3D file (glTF/FBX/USD) and get frames or an MP4 back; no local Blender or GPU. Free up to 500 JPY of GPU time per new key, then 0.1 JPY per GPU-second."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["blender", "rendering", "render-farm", "cloud-rendering", "gpu", "mcp", "mcp-server", "model-context-protocol", "ai-agent", "claude", "codex", "cursor", "gltf", "bpy", "chatgpt", "claude-code", "blender-mcp", "3d-rendering", "cycles"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "mcp>=1.10"]
authors = [{ name = "JasmyLab Inc.", email = "contact@jasmylab.com" }]

[project.urls]
Homepage = "https://render.janction.jp"
Documentation = "https://render.janction.jp/blender-render-api"
Repository = "https://github.com/JasmyLab-JANCTION/janction-render"
Issues = "https://github.com/JasmyLab-JANCTION/janction-render/issues"
Status = "https://render.janction.jp/status"
Changelog = "https://render.janction.jp/changelog"
Pricing = "https://render.janction.jp/pricing"
"Fact sheet" = "https://render.janction.jp/facts"
"llms.txt" = "https://render.janction.jp/llms.txt"

[project.optional-dependencies]
mcp = ["mcp>=1.10"]
blend = ["blender-asset-tracer>=1.20"]
dev = ["pytest>=8"]

[project.scripts]
janction-render = "janction_render.cli:main"
janction-render-mcp = "janction_render.mcp_server:main"

[tool.setuptools.packages.find]
include = ["janction_render*"]

[tool.setuptools.package-data]
janction_render = ["mcp_app.html"]
